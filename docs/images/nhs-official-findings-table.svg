<desc id="desc">Surplus or deficit before impairments and transfers: plus £562m, minus £457m, minus £2312m. Providers reporting deficit: 74 of 215, 105 of 212, 136 of 211. Percentages: 34.4%, 49.5%, 64.5%.</desc>
