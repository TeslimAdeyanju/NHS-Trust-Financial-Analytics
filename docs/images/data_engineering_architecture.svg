45 498" stroke="#24576f" stroke-width="3" fill="none"/><rect x="550" y="170" width="245" height="550" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="550" y="170" width="245" height="112" rx="13" fill="#407b62"/><rect x="550" y="260" width="245" height="22" fill="#407b62"/><text x="567" y="199" font-size="17" font-weight="700" fill="#e9f2f8">STAGE 03</text><text x="567" y="232" font-size="24" font-weight="700" fill="white">CLEANING &amp;</text><text x="567" y="261" font-size="24" font-weight="700" fill="white">TRANSFORM</text><text x="567" y="311" font-size="18" font-weight="700" fill="#407b62">Python + MySQL</text><rect x="562" y="335" width="221" height="99" rx="9" fill="#f7f9fc" stroke="#d4dfe9"/><text x="573" y="370" font-size="17" font-weight="700" fill="#20354b">Schema harmonisation</text><text x="573" y="399" font-size="15.5" fill="#52677c">CY / PY + units + codes</text><rect x="562" y="455" width="221" height="99" rx="9" fill="#f7f9fc" stroke="#d4dfe9"/><text x="573" y="490" font-size="17" font-weight="700" fill="#20354b">Data-quality checks</text><text x="573" y="519" font-size="15.5" fill="#52677c">Nulls / keys / duplicates</text><rect x="562" y="575" width="221" height="99" rx="9" fill="#ecf3f9" stroke="#d4dfe9"/><text x="573" y="610" font-size="17" font-weight="700" fill="#20354b">SILVER conformed</text><text x="573" y="639" font-size="15.5" fill="#52677c">dim_trust / fct_tac</text><path d="M 796 490 H 805" stroke="#24576f" stroke-width="4" fill="none"/><path d="M 800 482 L 806 490 L 800 498" stroke="#24576f" stroke-width="3" fill="none"/><rect x="805" y="170" width="245" height="550" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="805" y="170" width="245" height="112" rx="13" fill="#5e6e9e"/><rect x="805" y="260" width="245" height="22" fill="#5e6e9e"/><text x="822" y="199" font-size="17" font-weight="700" fill="#e9f2f8">STAGE 04</text><text x="822" y="232" font-size="24" font-weight="700" fill="white">MODELLING &amp;</te