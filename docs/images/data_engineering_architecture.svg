72" y="455" width="221" height="99" rx="9" fill="#f7f9fc" stroke="#d4dfe9"/><text x="1083" y="490" font-size="17" font-weight="700" fill="#20354b">Reporting datasets</text><text x="1083" y="519" font-size="15.5" fill="#52677c">Facts + dimensions</text><rect x="1072" y="575" width="221" height="99" rx="9" fill="#ecf3f9" stroke="#d4dfe9"/><text x="1083" y="610" font-size="17" font-weight="700" fill="#20354b">Export validation</text><text x="1083" y="639" font-size="15.5" fill="#52677c">Units / totals / joins</text><path d="M 1306 490 H 1315" stroke="#24576f" stroke-width="4" fill="none"/><path d="M 1310 482 L 1316 490 L 1310 498" stroke="#24576f" stroke-width="3" fill="none"/><rect x="1315" y="170" width="245" height="550" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="1315" y="170" width="245" height="112" rx="13" fill="#a46d46"/><rect x="1315" y="260" width="245" height="22" fill="#a46d46"/><text x="1332" y="199" font-size="17" font-weight="700" fill="#e9f2f8">STAGE 06</text><text x="1332" y="232" font-size="24" font-weight="700" fill="white">VISUALISATION</text><text x="1332" y="261" font-size="24" font-weight="700" fill="white">&amp; INSIGHTS</text><text x="1332" y="311" font-size="18" font-weight="700" fill="#a46d46">Power BI / DAX</text><rect x="1327" y="335" width="221" height="99" rx="9" fill="#f7f9fc" stroke="#d4dfe9"/><text x="1338" y="370" font-size="17" font-weight="700" fill="#20354b">Semantic model</text><text x="1338" y="399" font-size="15.5" fill="#52677c">Relationships + DAX</text><rect x="1327" y="455" width="221" height="99" rx="9" fill="#f7f9fc" stroke="#d4dfe9"/><text x="1338" y="490" font-size="17" font-weight="700" fill="#20354b">Financial report pages</text><text x="1338" y="519" font-size="15.5" fill="#52677c">Trends / comparisons</text><rect x="1327" y="575" width="221" height="99" rx="9" fill="#ecf3f9" stroke="#d4dfe9"/><text x="1338" y="610" font-size="17" font-weight="700" fill="#20354b">Publication pending</text><text x="