<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">NHS Trust Financial Analytics - Data Engineering Architecture</title><desc id="diagramDesc">Six-stage batch data pipeline from NHS England TAC Excel workbooks to Python ingestion, MySQL Bronze and Silver, SQL Gold analytical models, Python reporting exports, and Power BI. Cross-cutting audit, data-quality and financial reconciliation controls and a pending publication notice.</desc><rect width="1600" height="970" fill="#f7f9fc"/><rect width="1600" height="126" fill="#152a42"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="56" font-size="37" font-weight="700" fill="#fff">NHS Trust Financial Analytics</text><text x="44" y="91" font-size="21" fill="#cad8e9">Batch data engineering architecture  |  TAC financial years 2021/22-2023/24  |  UK NHS providers</text><text x="44" y="151" font-size="17" font-weight="700" fill="#3f5366">PRIMARY DATA FLOW</text><rect x="40" y="170" width="245" height="550" rx="13" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="40" y="170" width="245" height="112" rx="13" fill="#285e86"/><rect x="40" y="260" width="245" height="22" fill="#285e86"/><text x="57" y="199" font-size="17" font-weight="700" fill="#e9f2f8">STAGE 01</text><text x="57" y="232" font-size="24" font-weight="700" fill="white">DATA</text><text x="57" y="261" font-size="24" font-weight="700" fill="white">SOURCING</text><text x="57" y="311" font-size="18" font-weight="700" fill="#285e86">NHS England</text><rect x="52" y="335" width="221" height="99" rx="9" fill="#f7f9fc" stroke="#d4dfe9"/><text x="63" y="370" font-size="17" font-weight="700" fill="#20354b">TAC publications</text><text x="63" y="399" font-size="15.5" fill="#52677c">2021/22 - 2023/24</text><rect x="52" y="455" width="221" height="99" rx="9" fill="#f7f9fc" stroke="#d4dfe9"/><text x="63" y="490" font-size="17" font-weight="700" fill